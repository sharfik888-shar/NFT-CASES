let bi=0;
const box=n=>{const [a,b]=CC[n]||['#ff5a6b','#b3101f'],id='g'+(bi++);
return `<svg class="bx" viewBox="0 0 100 100"><defs><linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient><linearGradient id="${id}l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".25" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient><radialGradient id="${id}r"><stop offset="0" stop-color="${a}" stop-opacity=".55"/><stop offset="1" stop-color="${a}" stop-opacity="0"/></radialGradient></defs><circle cx="50" cy="55" r="48" fill="url(#${id}r)"/><ellipse cx="50" cy="91" rx="34" ry="4.5" fill="#000" opacity=".55"/><rect x="16" y="46" width="68" height="42" rx="7" fill="url(#${id}b)"/><rect x="16" y="76" width="68" height="12" rx="6" fill="#000" opacity=".25"/><rect x="11" y="27" width="78" height="25" rx="7" fill="url(#${id}l)"/><rect x="11" y="45" width="78" height="4" fill="#000" opacity=".28"/><rect x="43" y="44" width="14" height="11" rx="3" fill="#fff"/><circle cx="50" cy="50" r="2.4" fill="${b}"/><g transform="translate(0,4)" fill="#fff" opacity=".95">${SY[n]||''}</g><circle cx="22" cy="35" r="1.6" fill="#fff" opacity=".8"/><circle cx="78" cy="33" r="1.1" fill="#fff" opacity=".8"/></svg>`};
C.forEach(c=>{c.e=box(c.n);c.i.forEach(x=>x.e=em(x.e,x.img,x.n))});
const P={START:500,RED:1000,BLACK:1000,PEPE:777,DUROV:2000,SNOOP:420,HELLO:666,MOON:1500,WINTER:1500,BEACH:1000};
let S={b:1000,inv:[],used:[],fr:0,id:1,sel:null,m:2,nick:'Игрок',o:0,sp:0,best:0,snd:true,vib:true,mus:true},tab='cases',cur=null,busy=false,tt;
try{const x=JSON.parse(localStorage.getItem('nftc'));if(x&&typeof x.b==='number')S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem('nftc',JSON.stringify(S))}catch(e){}cloudSave()};
function toast(t){const e=$('#toast');e.innerHTML=star(t);e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2300)}
function pick(c){let r=Math.random()*100;for(const x of c.i){r-=x.w;if(r<0)return x}return c.i[0]}
const cell=x=>`<div class="cell" style="border-color:${TC[x.t]}">${x.e}<small>⭐ ${fmt(x.p)}</small></div>`;
function go(t){if(busy)return toast('Подожди, идёт открытие…');tab=t;cur=null;render()}
function view(i){if(busy)return;cur=i;render();scrollTo(0,0)}
function back(){if(busy)return;cur=null;render()}
function render(){
setBal();
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
$('#main').innerHTML=star(cur!==null?caseView():({cases:casesView,up:upView,inv:invView,promo:promoView,prof:profView,top:topView})[tab]());
cd()}
function casesView(){return '<h2>Кейсы</h2><div class="grid">'+C.map((c,i)=>`<div class="card" onclick="view(${i})"><div class="pic">${c.e}</div><div class="nm">${c.n}</div><div class="pr">${c.p?'⭐ '+fmt(c.p):'БЕСПЛАТНО'}</div></div>`).join('')+'</div>'}
function caseView(){const c=C[cur],idle=[];for(let k=0;k<20;k++)idle.push(pick(c));
return `<button class="btn g" style="margin:0 0 12px;padding:10px" onclick="back()">← Назад</button><h2>${c.e} ${c.n}</h2><div id="rouls"><div class="roul"><div class="strip" id="strip">${idle.map(cell).join('')}</div></div></div>${c.p?XS():''}<button class="btn" id="open" onclick="openCase()">${c.p?'Открыть'+(xn>1?' ×'+xn:'')+' за ⭐ '+fmt(c.p*xn):'Открыть бесплатно'}</button><p class="pr" style="text-align:center" id="cd"></p><h2 style="margin-top:18px">Что внутри</h2><div class="grid4">`+c.i.map(x=>`<div class="mini" style="border-color:${TC[x.t]}">${x.e}<small>⭐ ${fmt(x.p)}</small><small>${x.w}%</small></div>`).join('')+'</div>'}
function cd(){if(cur===null||busy)return;const c=C[cur];if(c.p)return;const b=$('#open'),t=$('#cd');if(!b||!t)return;const l=S.fr-Date.now();
if(l>0){b.disabled=true;t.textContent='Следующий бесплатный кейс через '+Math.floor(l/60000)+':'+String(Math.floor(l/1000)%60).padStart(2,'0')}else{b.disabled=false;t.textContent=''}}
setInterval(cd,500);
function openCase(){if(busy||cur===null)return;const c=C[cur],n=c.p?xn:1;
if(c.p===0&&Date.now()<S.fr)return;
if(S.b<c.p*n)return toast('Не хватает ⭐ — забери промокод');
busy=true;S.b-=c.p*n;if(c.p===0)S.fr=Date.now()+300000;
const its=[],arrs=[];
for(let j=0;j<n;j++){const win=pick(c),arr=[];for(let k=0;k<40;k++)arr.push(k===34?win:pick(c));const it={id:S.id++,e:win.e,n:win.n,p:win.p,t:win.t};S.inv.push(it);S.o++;S.sp+=c.p;S.best=Math.max(S.best,win.p);its.push(it);arrs.push(arr)}
save();setBal();$('#open').disabled=true;
const bx=$('#rouls');bx.innerHTML=arrs.map(()=>'<div class="roul"><div class="strip"></div></div>').join('');
bx.querySelectorAll('.strip').forEach((st,j)=>{st.innerHTML=star(arrs[j].map(cell).join(''));const x=-(34*100+50)+st.parentElement.clientWidth/2+(Math.random()*60-30);st.getBoundingClientRect();st.style.transition='transform '+(5+j*.3)+'s cubic-bezier(.12,.8,.18,1)';st.style.transform='translateX('+x+'px)'});
for(let k=0;k<24;k++)setTimeout(()=>snd('tick'),250+k*k*8);
setTimeout(()=>{busy=false;render();snd('win');n>1?modalMany(its):modal(its[0])},5400+n*300)}
function modal(it){const d=document.createElement('div');d.className='modal';
d.innerHTML=star(`<div class="mbox" style="border-color:${TC[it.t]}"><div class="pic" style="width:120px;height:120px;font-size:68px">${it.e}</div><div class="nm" style="font-size:20px">${it.n}</div><div class="pr">⭐ ${fmt(it.p)}</div><button class="btn" id="mk">Забрать</button><button class="btn w" id="ms">Продать за ⭐ ${fmt(it.p)}</button></div>`);
document.body.appendChild(d);$('#mk').onclick=()=>d.remove();$('#ms').onclick=()=>{sell(it.id);d.remove()}}
function sell(id){const k=S.inv.findIndex(x=>x.id===id);if(k<0)return;S.b+=S.inv[k].p;S.inv.splice(k,1);if(S.sel===id)S.sel=null;save();render()}
function sellAll(){if(!S.inv.length)return;const t=S.inv.reduce((a,x)=>a+x.p,0);S.b+=t;S.inv=[];S.sel=null;save();render();toast('Продано на ⭐ '+fmt(t))}
function invView(){const tot=S.inv.reduce((a,x)=>a+x.p,0);
return `<h2>Инвентарь</h2><p class="pr" style="margin:-6px 0 12px">Предметов: ${S.inv.length}, стоимость ⭐ ${fmt(tot)}</p>`+(S.inv.length?`<button class="btn g" style="margin:0 0 12px" onclick="sellAll()">Продать всё</button><div class="grid">`+S.inv.slice().reverse().map(x=>`<div class="card" style="border-color:${TC[x.t]}"><div class="pic">${x.e}</div><div class="nm">${x.n}${x.u?' ×'+x.u:''}</div><div class="pr">⭐ ${fmt(x.p)}</div><button class="btn" style="padding:10px;font-size:14px" onclick="sell(${x.id})">Продать</button></div>`).join('')+'</div>':'<div class="card" style="padding:30px"><div class="pic">📦</div><div class="pr">Здесь пусто. Открой первый кейс.</div></div>')}
function upView(){const ch=Math.round(90/S.m),it=S.inv.find(x=>x.id===S.sel);
return `<h2>Апгрейд</h2><div class="wheel" style="background:conic-gradient(var(--red) 0 ${ch}%,#262626 0)"><div class="ptr" id="ptr"></div><div class="wc">${it?it.e:'❔'}<small>${it?'⭐ '+fmt(it.p)+' → '+fmt(it.p*S.m):'Выбери предмет'}</small></div></div><p class="pr" style="text-align:center;margin:0 0 12px">Шанс успеха ${ch}%</p><div class="mults">`+[2,3,5,10].map(m=>`<button class="${m===S.m?'on':''}" onclick="setM(${m})">×${m}</button>`).join('')+`</div><button class="btn" id="upb" onclick="doUp()" ${it?'':'disabled'}>Улучшить</button><h2 style="margin-top:20px">Твои предметы</h2>`+(S.inv.length?'<div class="grid4">'+S.inv.map(x=>`<div class="mini ${x.id===S.sel?'sel':''}" onclick="pickUp(${x.id})">${x.e}<small>⭐ ${fmt(x.p)}</small></div>`).join('')+'</div>':'<p class="pr">Нет предметов. Сначала открой кейс.</p>')}
function setM(m){if(busy)return;S.m=m;render()}
function pickUp(id){if(busy)return;S.sel=id;render()}
function doUp(){if(busy)return;const it=S.inv.find(x=>x.id===S.sel);if(!it)return;
busy=true;const ch=Math.round(90/S.m)/100,r=Math.random(),win=r<ch;$('#upb').disabled=true;
$('#ptr').style.transform='rotate('+(360*5+r*360)+'deg)';
setTimeout(()=>{busy=false;if(win){it.p*=S.m;it.u=(it.u||1)*S.m;snd('win');toast('Успех! Цена ×'+S.m+' 🔥')}else{S.inv=S.inv.filter(x=>x.id!==it.id);S.sel=null;snd('lose');toast('Не повезло, предмет сгорел 💀')}save();render()},4200)}
function promoView(){return `<h2>Промокоды</h2><input id="pi" placeholder="Введи промокод" autocomplete="off" autocapitalize="characters"><button class="btn" onclick="promo()">Активировать</button>`}
function promo(){const v=$('#pi').value.trim().toUpperCase();if(!v)return toast('Введи промокод');
if(!P.hasOwnProperty(v))return toast('Такого промокода нет ❌');
if(S.used.includes(v))return toast('Этот код уже использован');
S.used.push(v);S.b+=P[v];save();render();toast('+⭐ '+fmt(P[v])+' 🎉')}
let shown=S.b,AC;
function setBal(){const from=shown,to=S.b,t0=performance.now(),el=$('#bal');shown=to;(function f(t){const k=Math.min(1,(t-t0)/600),v=from+(to-from)*(1-Math.pow(1-k,3));el.innerHTML=star('⭐ '+fmt(v));if(k<1)requestAnimationFrame(f)})(t0)}
function snd(t){if(S.vib&&t!=='tick'&&navigator.vibrate){try{navigator.vibrate(t==='win'?[30,40,60]:12)}catch(e){}}
if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),f={tap:[520,.06],tick:[900,.03],win:[880,.3],lose:[160,.35]}[t]||[500,.05];o.type=t==='lose'?'sawtooth':'sine';o.frequency.value=f[0];o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.07,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+f[1]);o.start();o.stop(AC.currentTime+f[1])}catch(e){}}
document.addEventListener('click',e=>{if(e.target.closest('button,.card,.mini,.row'))snd('tap')});
const lvl=()=>Math.floor(S.o/5)+1;
const sw=(k,t)=>`<div class="row" onclick="tog('${k}')"><span>${t}</span><i class="sw ${S[k]?'on':''}"></i></div>`;
function tog(k){S[k]=!S[k];save();render()}
function setNick(v){S.nick=v.replace(/[<>&"]/g,'').trim().slice(0,14)||'Игрок';save();render()}
function resetAll(){if(!confirm('Сбросить весь прогресс?'))return;try{localStorage.removeItem('nftc')}catch(e){}try{CS&&CS.setItem('n','0')}catch(e){}setTimeout(()=>location.reload(),500)}
function topList(v){const L=[['CryptoKing',250000],['NFT_Master',120000],['Pepe_Lord',64000],['SnoopFan',31000],['Dubai_Whale',17500],['Gift_Hunter',9800],['Newbie',4200],['Lucky_Sam',2100],['Case_Fan',900],[S.nick,v,1]].sort((a,b)=>b[1]-a[1]);
return '<div>'+L.map((x,i)=>`<div class="top ${x[2]?'me':''}"><b>${i+1}</b><span>${x[2]?x[0]+' (ты)':x[0]}</span>⭐ ${fmt(x[1])}</div>`).join('')+'</div>'}
function profView(){const v=S.b+S.inv.reduce((a,x)=>a+x.p,0);
return `<div class="card prof"><div class="ava">${S.nick[0].toUpperCase()}</div><div style="flex:1"><input value="${S.nick}" maxlength="14" onchange="setNick(this.value)" style="text-transform:none;padding:10px"><div class="pr" style="margin-top:6px">Уровень ${lvl()}</div></div></div>
<h2>Статистика</h2><div class="grid"><div class="card"><div class="nm">${S.o}</div><div class="pr">Открыто кейсов</div></div><div class="card"><div class="nm">⭐ ${fmt(S.best)}</div><div class="pr">Лучший дроп</div></div><div class="card"><div class="nm">⭐ ${fmt(S.sp)}</div><div class="pr">Потрачено</div></div><div class="card"><div class="nm">⭐ ${fmt(v)}</div><div class="pr">Богатство</div></div></div>
<h2 style="margin-top:20px">Настройки</h2>${sw('mus','Музыка')}${sw('snd','Звук')}${sw('vib','Вибрация')}<button class="btn" onclick="exportSave()">Скопировать код прогресса</button><button class="btn g" onclick="importSave()">Загрузить прогресс по коду</button><p class="pr" style="margin:10px 2px">Если после выхода из игры всё пропадает, скопируй код и сохрани в заметках. В следующий раз загрузи его здесь.</p><button class="btn g" onclick="resetAll()">Сбросить прогресс</button>`}
function exportSave(){const c=btoa(unescape(encodeURIComponent(JSON.stringify(S))));const ok=()=>toast('Код скопирован. Сохрани его в заметках');(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(c):Promise.reject()).then(ok).catch(()=>{prompt('Скопируй код прогресса:',c)})}
function importSave(){const c=prompt('Вставь код прогресса');if(!c)return;try{const x=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));if(typeof x.b!=='number')throw 0;Object.assign(S,x);save();render();toast('Прогресс загружен')}catch(e){toast('Неверный код')}}
const TG=window.Telegram&&Telegram.WebApp,CS=TG&&TG.CloudStorage;let ct,cloudReady=false;
if(TG){try{TG.ready();TG.expand();TG.setHeaderColor&&TG.setHeaderColor('#0a0a0a');TG.setBackgroundColor&&TG.setBackgroundColor('#0a0a0a')}catch(e){}}
function cloudSave(){if(!CS||!cloudReady)return;clearTimeout(ct);ct=setTimeout(()=>{try{const j=JSON.stringify(S),n=Math.ceil(j.length/3500);for(let k=0;k<n;k++)CS.setItem('c'+k,j.slice(k*3500,(k+1)*3500));CS.setItem('n',String(n))}catch(e){}},500)}
function cloudLoad(){if(!CS){return}try{CS.getItem('n',(e,v)=>{const n=parseInt(v);if(e||!n){cloudReady=true;return}CS.getItems(Array.from({length:n},(_,k)=>'c'+k),(e2,r)=>{try{if(!e2){const x=JSON.parse(Array.from({length:n},(_,k)=>r['c'+k]).join(''));if(typeof x.b==='number'){Object.assign(S,x);shown=S.b;render()}}}catch(z){}cloudReady=true})})}catch(e){cloudReady=true}}
const BG=new Audio('music.mp3');BG.loop=true;BG.volume=.35;BG.preload='auto';
function musicSync(){try{if(S.mus&&!document.hidden){const p=BG.play();if(p&&p.catch)p.catch(()=>{})}else BG.pause()}catch(e){}}
document.addEventListener('click',musicSync);document.addEventListener('visibilitychange',musicSync);
let xn=1;
const XS=()=>'<div class="mults" style="margin-top:12px">'+[1,2,3,4,5].map(k=>`<button class="${k===xn?'on':''}" onclick="setX(${k})">×${k}</button>`).join('')+'</div>';
function setX(k){if(busy)return;xn=k;render()}
function modalMany(its){const d=document.createElement('div');d.className='modal';const tot=its.reduce((a,x)=>a+x.p,0);
d.innerHTML=star(`<div class="mbox" style="border-color:#e11d2e;max-height:88vh;overflow:auto"><div class="nm" style="font-size:18px;margin-bottom:10px">Выпало подарков: ${its.length}</div><div class="grid4">${its.map(x=>`<div class="mini" style="border-color:${TC[x.t]}">${x.e}<small>⭐ ${fmt(x.p)}</small></div>`).join('')}</div><button class="btn" id="mk">Забрать все</button><button class="btn w" id="ms">Продать все за ⭐ ${fmt(tot)}</button></div>`);
document.body.appendChild(d);$('#mk').onclick=()=>d.remove();
$('#ms').onclick=()=>{its.forEach(x=>{const k=S.inv.findIndex(y=>y.id===x.id);if(k>=0){S.b+=S.inv[k].p;S.inv.splice(k,1)}});S.sel=null;save();render();d.remove()}}
function topView(){const v=S.b+S.inv.reduce((a,x)=>a+x.p,0);return '<h2>Топ игроков</h2><p class="pr" style="margin:-6px 0 12px">По стоимости баланса и предметов</p>'+topList(v)}
render();cloudLoad();
</script></body></html>
