.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;font-weight:800}
.sw{width:46px;height:26px;border-radius:99px;background:#333;position:relative;transition:background .25s}

.top{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;font-weight:800}

.mbox{position:relative;overflow:hidden}.mbox::before{content:"";position:absolute;inset:-70%;background:repeating-conic-gradient(rgba(225,29,46,.2) 0 10deg,transparent 10deg 20deg);animation:spin 14s linear infinite}.mbox>*{position:relative}

.btn,.card,.mini,.row{transition:transform .18s cubic-bezier(.3,1.3,.5,1),filter .2s,border-color .2s}

'/><path fill='%23000' fill-opacity='.35' d='M12 16L9 21 9 14z'/></g><g transform='translate(62 228) rotate(50) scale(0.7)'><path fill='%23262626' fill-opacity='1' d='M1 11L23 2 19 21 12 16z'/><path fill='%23000' fill-opacity='.35' d='M12 16L9 21 9 14z'/></g></svg>") 0 0/260px 260px;animation:drift 70s linear infinite;will-change:transform}

.roul{contain:layout paint}
